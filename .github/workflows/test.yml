name: Test

# Type-checks, tests and builds @curvet/cli on every pull request into main and
# on every push to it.
#
# No secrets are used or needed: no test calls the network or reads an API
# key. @curvet/sdk and @curvet/mcp come from the public npm registry at the
# versions in package-lock.json.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # A new push to the same PR or branch cancels the run it replaces.
  group: cli-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json "engines" says Node >= 18, but the locked dependencies
        # need Node 22 (ink 7, cli-truncate and slice-ansi all declare >= 22),
        # so only 22 and the newer LTS are tested.
        node: [22, 24]
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
